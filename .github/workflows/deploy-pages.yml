name: Publish portfolio

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Base portfolio-v1 or a release containing portfolio-update.zip
        required: true
        default: portfolio-cv-20261105
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the original website release package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/portfolio-release"
          gh release download portfolio-v1 --pattern portfolio-site.zip --dir "$RUNNER_TEMP/portfolio-release"
          unzip -q "$RUNNER_TEMP/portfolio-release/portfolio-site.zip" -d _site
          test -s _site/index.html

      - name: Apply the selected cumulative update
        if: inputs.release_tag != 'portfolio-v1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$UPDATE_TAG" --pattern portfolio-update.zip --dir "$RUNNER_TEMP/portfolio-release"
          unzip -oq "$RUNNER_TEMP/portfolio-release/portfolio-update.zip" -d _site
          test -s _site/assets/materials/weinan-meng-cv.pdf

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
